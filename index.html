<!doctype html>
<!-- La página que abre el QR en el móvil del cliente. Es la misma para todos los
     proyectos: publicada (ARviewerOL-visor en GitHub Pages) descifra el modelo con
     la clave de la dirección; en la previa de ARviewerOL lee proyecto.json. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ortiz.Leon Arquitectos</title>
<link rel="icon" href="monograma.png">
<script type="module" src="model-viewer.min.js"></script>
<script src="qrcode.js"></script>
<style>
  :root {
    --tinta: #262626; --tenue: #787673; --lienzo: #f0efec; --elevada: #fff;
    --oliva: #3f5544; --filete: #d7d5d2;
    --serie: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--lienzo); color: var(--tinta);
    font-family: var(--serie); -webkit-font-smoothing: antialiased; }
  model-viewer { position: fixed; inset: 0; width: 100%; height: 100%;
    --poster-color: transparent; --progress-bar-color: var(--oliva); }
  .cabecera { position: fixed; z-index: 2; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 16px; pointer-events: none; }
  .cabecera img { height: 24px; width: auto; flex: none; }
  .cabecera .nombre { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .cabecera .estudio { font-size: 12px; color: var(--tenue); }
  .pie { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px 20px calc(env(safe-area-inset-bottom) + 22px); pointer-events: none; }
  .pie > * { pointer-events: auto; }
  .boton-ar { display: inline-flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 26px; border: 0; border-radius: 26px;
    background: var(--oliva); color: #fff; font: 700 16px var(--serie);
    box-shadow: 0 6px 22px rgba(38, 38, 38, .22); cursor: pointer; }
  .boton-ar svg { width: 22px; height: 22px; }
  .sin-ar { display: none; max-width: 34ch; font-size: 13px; color: var(--tinta);
    text-align: center; background: rgba(255,255,255,.8); padding: 10px 14px; border-radius: 10px; }
  .qr-aqui { display: none; width: 128px; padding: 6px; background: #fff; border-radius: 10px;
    box-shadow: 0 4px 16px rgba(38,38,38,.12); }
  .qr-aqui svg { display: block; width: 100%; height: auto; }
  /* El conmutador de estilo (Blanco, Texturas, Madera), abajo y al centro, encima del
     botón de AR: arriba a la derecha no cabía en un móvil y se montaba en el nombre */
  .estilos { display: none; padding: 3px; gap: 2px; border-radius: 99px;
    background: rgba(255,255,255,.82); box-shadow: 0 2px 10px rgba(38,38,38,.12);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .estilos button { height: 30px; padding: 0 13px; border: 0; border-radius: 99px; background: none;
    font: 600 13px var(--serie); color: var(--tenue); cursor: pointer; }
  .estilos button[aria-pressed="true"] { background: var(--oliva); color: #fff; }
  /* Dentro de la AR de Android (WebXR) el conmutador pasa a model-viewer, que es lo
     único de la página que sigue en pantalla */
  .estilos.en-ar { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 28px); }
  .estilos.en-ar button { height: 38px; padding: 0 16px; font-size: 15px; }
  body.portada .cabecera, body.portada .pie, body.portada .estilos { display: none !important; }
  .error { position: fixed; inset: 0; display: none; place-items: center; padding: 30px;
    text-align: center; color: var(--tenue); }
</style>
</head>
<body>
<header class="cabecera">
  <img src="monograma.png" alt="">
  <div><div class="nombre" id="nombre">&nbsp;</div>
       <div class="estudio">Ortiz.Leon Arquitectos</div></div>
</header>

<model-viewer id="visor" alt="Modelo 3D del proyecto"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls touch-action="pan-y" interaction-prompt="auto"
  camera-orbit="-35deg 65deg auto" shadow-intensity="1" shadow-softness="0.8"
  environment-image="luz.hdr" exposure="1">
  <button slot="ar-button" class="boton-ar" style="display:none" aria-hidden="true"></button>
</model-viewer>

<div class="pie">
  <div class="estilos" id="estilos" role="group" aria-label="Cómo se ve la maqueta">
    <button data-estilo="blanco" aria-pressed="false">Blanco</button>
    <button data-estilo="texturas" aria-pressed="true">Texturas</button>
    <button data-estilo="madera" aria-pressed="false">Madera</button>
  </div>
  <button class="boton-ar" id="ver-ar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
    Ver en tu espacio</button>
  <div class="qr-aqui" id="qr-aqui"></div>
  <div class="sin-ar" id="sin-ar">Gira el modelo con el dedo. Para verlo en tu espacio, abre esta
    página en un móvil o una tableta.</div>
</div>
<div class="error" id="error">No se ha podido abrir el modelo.</div>

<script>
// Dos maneras de abrir un modelo:
//  - publicado: la dirección lleva #<id>.<clave>. Se baja m/<id>.bin (cifrado,
//    AES-256-GCM) y se descifra aquí con la clave, que no sale nunca del móvil.
//  - previa en ARviewerOL: sin «#», proyecto.json y modelo.glb a su lado.
(async function () {
  const visor = document.getElementById('visor');
  const error = texto => {
    const e = document.getElementById('error');
    e.textContent = texto; e.style.display = 'grid';
    document.querySelector('.pie').style.display = 'none';
  };
  const deB64url = t => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/') +
    '='.repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0));

  async function abrirCifrado(id, clave) {
    const r = await fetch('m/' + id + '.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('no-esta');
    const caja = new Uint8Array(await r.arrayBuffer());
    const llave = await crypto.subtle.importKey('raw', deB64url(clave), 'AES-GCM', false, ['decrypt']);
    const claro = new Uint8Array(await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: caja.slice(0, 12) }, llave, caja.slice(12)));
    // ARV1: el GLB tal cual. ARV2: comprimido (zlib) antes de cifrar, que cifrado
    // ya no se comprime: un modelo de 44 MB baja en 10.
    const formato = new TextDecoder().decode(claro.slice(0, 4));
    if (formato !== 'ARV1' && formato !== 'ARV2') throw new Error('formato');
    const n = new DataView(claro.buffer).getUint32(4, true);
    const p = JSON.parse(new TextDecoder().decode(claro.slice(8, 8 + n)));
    let glb = new Blob([claro.slice(8 + n)]);
    if (formato === 'ARV2') {
      if (!window.DecompressionStream) throw new Error('navegador');
      glb = await new Response(glb.stream().pipeThrough(new DecompressionStream('deflate'))).blob();
    }
    p.src = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    return p;
  }

  let p = {};
  const h = location.hash.slice(1);
  if (h) {
    const [id, clave] = h.split('.');
    if (!/^[\w-]{8,}$/.test(id || '') || !/^[\w-]{40,}$/.test(clave || '')) {
      error('Este enlace no está completo. Vuelve a escanear el código QR.'); return;
    }
    // El modelo está en la memoria del móvil, no en una dirección: Scene Viewer
    // (Android) no puede ir a buscarlo. Android entra por WebXR; iPhone, por
    // Quick Look con el USDZ que model-viewer hace al momento.
    visor.setAttribute('ar-modes', 'webxr quick-look');
    try { p = await abrirCifrado(id, clave); }
    catch (e) {
      error(e.message === 'no-esta' ? 'Este modelo ya no está publicado.'
          : e.message === 'navegador' ? 'Este navegador es demasiado antiguo para abrir el modelo. Actualízalo y vuelve a escanear el código.'
          : 'No se ha podido abrir el modelo con este enlace.');
      return;
    }
  } else {
    try { p = await (await fetch('proyecto.json', { cache: 'no-cache' })).json(); } catch (e) {}
    p.src = p.modelo || 'modelo.glb';
  }

  if (p.nombre) {
    document.getElementById('nombre').textContent = p.nombre;
    document.title = p.nombre + ' · Ortiz.Leon Arquitectos';
  }

  visor.addEventListener('error', () => error('No se ha podido abrir el modelo.'));
  visor.addEventListener('load', () => {
    const boton = document.getElementById('ver-ar');
    if (visor.canActivateAR) {
      boton.hidden = false;
      boton.addEventListener('click', () => visor.activateAR());
    } else {
      document.getElementById('sin-ar').style.display = 'block';
      // En un ordenador, el QR para pasarla al móvil: el de esta misma dirección
      // (publicada, con su clave) o, en la copia de Maqueta 3D, el que lleva proyecto.json
      const destino = /^https:/.test(location.href) ? location.href : p.qr;
      if (window.qrcode && destino && !matchMedia('(pointer: coarse)').matches) {
        const qr = qrcode(0, 'M'); qr.addData(destino); qr.make();
        const caja = document.getElementById('qr-aqui');
        caja.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        caja.style.display = 'block';
        document.getElementById('sin-ar').textContent = 'Gira el modelo con el ratón. Para verlo en tu espacio, escanea el código con el móvil.';
      }
    }
  });
  const pedido = new URLSearchParams(location.search).get('estilo');
  if (new URLSearchParams(location.search).has('portada')) {
    document.body.classList.add('portada');
    visor.setAttribute('interaction-prompt', 'none');      // sin la mano encima de la portada
  }
  // «color» es el nombre viejo de «texturas» (lo publicado antes del 05/11/2026)
  const deVerdad = e => e === 'color' ? 'texturas' : e;
  visor.addEventListener('load', () => prepararEstilos(
    ['blanco', 'texturas', 'madera'].includes(deVerdad(pedido)) ? deVerdad(pedido) : (deVerdad(p.estilo) || 'texturas')),
    { once: true });
  visor.src = p.src;

  // ── Los estilos ─────────────────────────────────────────────────────────
  // Los materiales del GLB se llaman por su papel (edificio, entorno, terreno,
  // vidrio, tronco, copa, y «lineas» las aristas). Lo que trae el GLB es el modo
  // Texturas: el aspecto de render de Revit, con su textura a tamaño real.
  //  · Blanco: como la «Línea oculta» de Revit, todo blanco mate con sus aristas,
  //    el terreno y los árboles en tonos muy pálidos.
  //  · Madera: maqueta de taller de tilo y abedul, veta fina y de poco contraste,
  //    el entorno en otro tono, metacrilato el vidrio, los árboles como el liquen
  //    seco de las maquetas. La veta se dibuja aquí, en un lienzo.
  const lineal = c => Math.pow(c / 255, 2.2);
  const deSRGB = (c, a) => [lineal(c[0]), lineal(c[1]), lineal(c[2]), a == null ? 1 : a];
  // Blanco, para lo que no trae su color de Revit: blanco, como pinta «Línea oculta»
  const BLANCO = {
    edificio: [[255, 255, 255]], entorno: [[255, 255, 255]], terreno: [[255, 255, 255]],
    agua: [[215, 235, 240]], verde: [[226, 234, 214]],
    copa: [[200, 210, 150]], tronco: [[175, 160, 140]], vidrio: [[230, 236, 240], 0.35],
  };
  // Madera: el agua y la vegetación (césped, jardineras) en maderas más oscuras, para
  // que se distingan del resto, como en una maqueta de taller
  const MADERA = {
    edificio: [[240, 229, 207]], entorno: [[228, 212, 184]], terreno: [[220, 201, 168]],
    verde: [[196, 170, 126]], agua: [[152, 128, 98]],
    copa: [[198, 180, 138]], tronco: [[178, 152, 114]], vidrio: [[234, 238, 236], 0.3],
  };
  // La transparencia de los árboles: la elige el estudio al publicar (en proyecto.json)
  const ALFA_ARBOLES = typeof p.alfa_arboles === 'number' && p.alfa_arboles >= 0.2 && p.alfa_arboles <= 1 ? p.alfa_arboles : 0.8;

  function lienzoDeVeta() {
    const N = 512, cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const g = cv.getContext('2d'), img = g.createImageData(N, N), d = img.data;
    const ruido = new Float32Array(N);
    let semilla = 7;
    for (let i = 0; i < N; i++) { semilla = (semilla * 16807) % 2147483647; ruido[i] = semilla / 2147483647; }
    const T = 2 * Math.PI / N;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      // Todo periódico en 512: la textura casa consigo misma al repetirse.
      // Tilo/abedul: fibras finas y casi rectas, muy poco contraste, y alguna veta
      // algo más oscura de tarde en tarde (como en las maquetas de referencia)
      const t = y + 1.4 * Math.sin(T * 2 * x) + 0.6 * Math.sin(T * 7 * x + 1.3);
      const fibra = 0.5 + 0.5 * Math.sin(T * 61 * t + 3 * ruido[x]);
      const veta = Math.pow(0.5 + 0.5 * Math.sin(T * 9 * t + 0.7), 14);
      const fila = ruido[((Math.round(t) % N) + N) % N];
      const v = 1 - 0.018 * fibra - 0.07 * veta - 0.025 * fila;
      const k = (y * N + x) * 4, c = Math.round(255 * v);
      d[k] = d[k + 1] = d[k + 2] = c; d[k + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return cv.toDataURL('image/png');
  }

  const ORIGINAL = new Map();
  let VETA = null;

  // El de las aristas (una línea, sin emisivo) hace saltar a model-viewer al leerlo:
  // con un error aquí se paraban todos los estilos
  function emisivoDe(m) {
    if (m.name === 'lineas') return null;
    try { return m.emissiveFactor.slice(); } catch (e) { return null; }
  }

  async function prepararEstilos(inicial) {
    // model-viewer carga los materiales cuando hacen falta: hay que pedírselo antes
    // de tocarlos (el de las aristas no llegaba cargado y paraba todos los estilos)
    // (con tope: el de las aristas, que son líneas, puede no cargarse nunca)
    await Promise.all(visor.model.materials.map(m => Promise.race([
      m.ensureLoaded().catch(() => {}), new Promise(r => setTimeout(r, 3000))])));
    for (const m of visor.model.materials) {
      if (m.isLoaded === false) continue;
      const pbr = m.pbrMetallicRoughness;
      ORIGINAL.set(m, { color: pbr.baseColorFactor.slice(), rugosidad: pbr.roughnessFactor,
                        textura: pbr.baseColorTexture ? pbr.baseColorTexture.texture : null,
                        alfa: m.getAlphaMode ? m.getAlphaMode() : null,
                        emisivo: emisivoDe(m) });
      if (m.name === 'lineas' && m.setAlphaMode) m.setAlphaMode('BLEND');   // para poder apagarlas
    }
    try { VETA = await visor.createTexture(lienzoDeVeta()); } catch (e) { VETA = null; }
    const caja = document.getElementById('estilos');
    caja.style.display = 'flex';
    caja.querySelectorAll('button').forEach(b => b.addEventListener('click', () => ponerEstilo(b.dataset.estilo)));
    // En la AR de Android (WebXR) solo queda en pantalla model-viewer: el conmutador
    // entra en él mientras dura y vuelve al pie al salir. Un toque en él no es un toque
    // en la maqueta (beforexrselect). En iPhone la AR es Quick Look, de Apple: no
    // enseña nada de la página, el modo se elige antes de entrar.
    const pie = document.querySelector('.pie');
    caja.addEventListener('beforexrselect', e => e.preventDefault());
    visor.addEventListener('ar-status', e => {
      if (e.detail.status === 'session-started') {
        caja.classList.add('en-ar'); visor.appendChild(caja);
      } else if (e.detail.status === 'not-presenting' || e.detail.status === 'failed') {
        caja.classList.remove('en-ar'); pie.prepend(caja);
      }
    });
    ponerEstilo(inicial);
  }

  function ponerEstilo(estilo) {
    document.querySelectorAll('#estilos button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.estilo === estilo)));
    for (const m of visor.model.materials) {
      const o = ORIGINAL.get(m);
      if (!o) continue;                         // un material que no se ha podido cargar
      try { vestir(m, o, estilo); } catch (e) { console.error('estilo', m.name, e); }
    }
    lineasVisibles(estilo === 'blanco');
    // Las aristas a resolución entera: model-viewer baja la resolución cuando el modelo
    // pesa (hasta la mitad) y una línea de un píxel salía gruesa y gris. Solo en Blanco,
    // que es el que las lleva: en los otros modos el móvil va más suelto.
    const MV = customElements.get('model-viewer');
    if (MV) MV.minimumRenderScale = estilo === 'blanco' ? 1 : 0.5;
    // La luz de cada modo. La de serie (exposición 1,05, curva «neutral») lavaba el
    // blanco y los colores claros en la previa; en AR manda la luz de la habitación.
    const luz = LUZ[estilo] || LUZ.texturas;
    visor.toneMapping = luz.curva;
    visor.exposure = luz.exposicion;
    visor.shadowIntensity = luz.sombra;
  }

  // Con el cielo de luz.hdr (sol y sombra, como la habitación en AR).
  //  · Blanco, sin curva: los colores salen tal cual los da Revit (BLANCO_LUZ).
  //  · Texturas, AgX: la curva «de cine», más suave y natural; con «neutral» los
  //    colores de Revit salían chillones y muy contrastados.
  const LUZ = {
    blanco: { curva: 'none', exposicion: 1.0, sombra: 0.5 },
    texturas: { curva: 'agx', exposicion: 1.25, sombra: 0.8 },
    madera: { curva: 'neutral', exposicion: 1.05, sombra: 1 },
  };
  // Texturas: los colores de aspecto de Revit, un poco menos saturados
  const DESATURA = 0.18;
  // En Texturas, los árboles de verdad, en los GLB de antes del 06/11/2026 (los traían
  // en el verde pálido de maqueta; los nuevos traen el suyo, sacado de Revit)
  const ARBOLES = { copa: [[112, 140, 86]], tronco: [[118, 98, 78]] };
  // Blanco es la «Línea oculta» de Revit: plano, cada cara de su color. Casi todo es
  // luz propia (emisiva) y el sol solo la modela un pelo, para que se lea el volumen.
  const BLANCO_LUZ = { propia: 0.86, sol: 0.16 };

  // Las aristas son líneas, y el material de una línea no lo cambia la API de
  // model-viewer (three.js le hace su propia copia): se encienden y apagan en la
  // escena. Sirve también en la AR de Android (WebXR, la misma escena); Quick Look
  // (iPhone) no lleva líneas.
  function lineasVisibles(si) {
    const sim = Object.getOwnPropertySymbols(visor).find(x => x.description === 'scene');
    const escena = sim && visor[sim];
    if (!escena || !escena.traverse) return;
    escena.traverse(o => {
      if (o.isLineSegments || o.isLine) {
        o.visible = si;
        // three.js ata la copia de la línea a otro material (salían del blanco del
        // edificio): su color se pone aquí.
        // Negras y opacas, como las de Revit (grises y transparentes se veían gruesas)
        if (o.material && o.material.color) {
          o.material.color.setRGB(0.01, 0.01, 0.01);
          o.material.transparent = false; o.material.opacity = 1; o.material.needsUpdate = true;
        }
      } else if (o.isMesh && o.material) {
        // las caras, un pelo hacia atrás: la arista se ve entera y no a trozos
        for (const m of [].concat(o.material)) {
          m.polygonOffset = si; m.polygonOffsetFactor = 1; m.polygonOffsetUnits = 1;
        }
      }
    });
    if (escena.queueRender) escena.queueRender();
  }

  // El color de Blanco: el de Revit si el material lo trae; si no, el de la tabla
  function colorDe(hex, papel) {
    if (hex && /^[0-9a-f]{6}$/i.test(hex)) return [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
    return (BLANCO[papel] || BLANCO.edificio)[0];
  }

  const gris = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

  function vestir(m, o, estilo) {
    // El nombre es «papel» o «papel;rrggbb», con el color del material en la
    // «Línea oculta» de Revit (su relleno sólido)
    const pbr = m.pbrMetallicRoughness, [papel, hex] = m.name.split(';');
    if (papel === 'lineas') return;           // las aristas van por lineasVisibles()
    const tex = pbr.baseColorTexture;
    const alfaCopa = papel === 'copa' ? ALFA_ARBOLES : null;
    const ponerAlfa = a => { if (m.setAlphaMode) m.setAlphaMode(a != null && a < 1 ? 'BLEND' : 'OPAQUE'); };
    let emisivo = o.emisivo;

    if (estilo === 'texturas') {
      let c = ARBOLES[papel] && hex == null ? deSRGB(ARBOLES[papel][0]) : o.color.slice();
      const g = gris(c);
      c = c.slice(0, 3).map(x => x + (g - x) * DESATURA).concat([alfaCopa != null ? alfaCopa : c[3]]);
      pbr.setBaseColorFactor(c);
      pbr.setRoughnessFactor(o.rugosidad);
      if (tex) tex.setTexture(o.textura);
      if (alfaCopa != null) ponerAlfa(alfaCopa);
      else if (m.setAlphaMode && o.alfa) m.setAlphaMode(o.alfa);
    } else if (estilo === 'blanco') {
      const [cTabla, aTabla] = BLANCO[papel] || BLANCO.edificio;
      const vidrio = papel === 'vidrio';
      const c = deSRGB(vidrio ? cTabla : colorDe(hex, papel));
      const a = alfaCopa != null ? alfaCopa : aTabla;
      ponerAlfa(a);
      pbr.setBaseColorFactor(vidrio ? c.slice(0, 3).concat([a])
                                    : c.slice(0, 3).map(x => x * BLANCO_LUZ.sol).concat([a == null ? 1 : a]));
      if (!vidrio) emisivo = c.slice(0, 3).map(x => x * BLANCO_LUZ.propia);
      pbr.setRoughnessFactor(vidrio ? 0.2 : 1);
      if (tex) tex.setTexture(null);
    } else {

      }
    }

  }
