<!doctype html>
<!-- La página que abre el QR en el móvil del cliente. Es la misma para todos los
     proyectos: publicada (ARviewerOL-visor en GitHub Pages) descifra el modelo con
     la clave de la dirección; en la previa de ARviewerOL lee proyecto.json. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ortiz.Leon Arquitectos</title>
<link rel="icon" href="monograma.png">
<script type="module" src="model-viewer.min.js"></script>
<script src="qrcode.js"></script>
<style>
  :root {
    --tinta: #262626; --tenue: #787673; --lienzo: #f0efec; --elevada: #fff;
    --oliva: #3f5544; --filete: #d7d5d2;
    --serie: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--lienzo); color: var(--tinta);
    font-family: var(--serie); -webkit-font-smoothing: antialiased; }
  model-viewer { position: fixed; inset: 0; width: 100%; height: 100%;
    --poster-color: transparent; --progress-bar-color: var(--oliva); }
  .cabecera { position: fixed; z-index: 2; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 16px; pointer-events: none; }
  .cabecera img { height: 24px; width: auto; flex: none; }
  .cabecera .nombre { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .cabecera .estudio { font-size: 12px; color: var(--tenue); }
  .pie { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px 20px calc(env(safe-area-inset-bottom) + 22px); pointer-events: none; }
  .pie > * { pointer-events: auto; }
  .boton-ar { display: inline-flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 26px; border: 0; border-radius: 26px;
    background: var(--oliva); color: #fff; font: 700 16px var(--serie);
    box-shadow: 0 6px 22px rgba(38, 38, 38, .22); cursor: pointer; }
  .boton-ar svg { width: 22px; height: 22px; }
  .sin-ar { display: none; max-width: 34ch; font-size: 13px; color: var(--tinta);
    text-align: center; background: rgba(255,255,255,.8); padding: 10px 14px; border-radius: 10px; }
  .qr-aqui { display: none; width: 128px; padding: 6px; background: #fff; border-radius: 10px;
    box-shadow: 0 4px 16px rgba(38,38,38,.12); }
  .qr-aqui svg { display: block; width: 100%; height: auto; }
  /* En la copia de Maqueta 3D, el enlace del QR debajo: para pegarlo en un correo */
  .enlace-aqui { display: flex; gap: 6px; }
  .enlace-aqui button, .enlace-aqui a { height: 28px; padding: 0 12px; border: 0; border-radius: 99px;
    display: inline-flex; align-items: center; background: rgba(255,255,255,.88); color: var(--tinta);
    font: 600 12px var(--serie); text-decoration: none; cursor: pointer;
    box-shadow: 0 2px 10px rgba(38,38,38,.12); }
  .nota-arv { max-width: 46ch; font-size: 12.5px; line-height: 1.45; color: var(--tinta); text-align: center;
    background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 10px;
    box-shadow: 0 2px 10px rgba(38,38,38,.12); }
  /* El conmutador de estilo (Blanco, Texturas, Madera), abajo y al centro, encima del
     botón de AR: arriba a la derecha no cabía en un móvil y se montaba en el nombre */
  .estilos { display: none; padding: 3px; gap: 2px; border-radius: 99px;
    background: rgba(255,255,255,.82); box-shadow: 0 2px 10px rgba(38,38,38,.12);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .estilos button { height: 30px; padding: 0 13px; border: 0; border-radius: 99px; background: none;
    font: 600 13px var(--serie); color: var(--tenue); cursor: pointer; }
  .estilos button[aria-pressed="true"] { background: var(--oliva); color: #fff; }
  /* Dentro de la AR de Android (WebXR) el conmutador pasa a model-viewer, que es lo
     único de la página que sigue en pantalla */
  .estilos.en-ar { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 28px); }
  .estilos.en-ar button { height: 38px; padding: 0 16px; font-size: 15px; }
  body.portada .cabecera, body.portada .pie, body.portada .estilos { display: none !important; }
  body.portada model-viewer { --progress-bar-height: 0px; }   /* salía como una raya verde arriba de la tarjeta */
  .error { position: fixed; inset: 0; display: none; place-items: center; padding: 30px;
    text-align: center; color: var(--tenue); }
</style>
</head>
<body>
<header class="cabecera">
  <img src="monograma.png" alt="">
  <div><div class="nombre" id="nombre">&nbsp;</div>
       <div class="estudio">Ortiz.Leon Arquitectos</div></div>
</header>

<model-viewer id="visor" alt="Modelo 3D del proyecto"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls touch-action="pan-y" interaction-prompt="auto"
  camera-orbit="-35deg 65deg auto" shadow-intensity="1" shadow-softness="0.8" reveal="manual" loading="eager"
  environment-image="luz.hdr" exposure="1">
  <button slot="ar-button" class="boton-ar" style="display:none" aria-hidden="true"></button>
</model-viewer>

<div class="pie">
  <div class="estilos" id="estilos" role="group" aria-label="Cómo se ve la maqueta">
    <button data-estilo="blanco" aria-pressed="false">Blanco</button>
    <button data-estilo="texturas" aria-pressed="true">Texturas</button>
    <button data-estilo="madera" aria-pressed="false">Madera</button>
  </div>
  <button class="boton-ar" id="ver-ar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
    Ver en tu espacio</button>
  <div class="qr-aqui" id="qr-aqui"></div>
  <div class="enlace-aqui" id="enlace-aqui" hidden>
    <button type="button" id="copiar-enlace">Copiar enlace</button>
    <a id="abrir-enlace" target="_blank" rel="noopener">Abrir el enlace</a>
    <button type="button" id="abrir-arv" title="Abrir este proyecto en ARviewerOL, si es de este equipo">Abrir en ARviewerOL</button>
  </div>
  <div class="nota-arv" id="nota-arv" hidden></div>
  <div class="sin-ar" id="sin-ar">Gira el modelo con el dedo. Para verlo en tu espacio, abre esta
    página en un móvil o una tableta.</div>
</div>
<div class="error" id="error">No se ha podido abrir el modelo.</div>

<script>
// Dos maneras de abrir un modelo:
//  - publicado: la dirección lleva #<id>.<clave>. Se baja m/<id>.bin (cifrado,
//    AES-256-GCM) y se descifra aquí con la clave, que no sale nunca del móvil.
//  - previa en ARviewerOL: sin «#», proyecto.json y modelo.glb a su lado.
(async function () {
  const visor = document.getElementById('visor');
  const error = texto => {
    const e = document.getElementById('error');
    e.textContent = texto; e.style.display = 'grid';
    document.querySelector('.pie').style.display = 'none';
  };
  // El enlace del QR, para copiarlo o abrirlo (la copia de Maqueta 3D)
  const mostrarEnlace = url => {
    const b = document.getElementById('copiar-enlace');
    document.getElementById('abrir-enlace').href = url;
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(url); b.textContent = 'Copiado'; }
      catch (e) { b.textContent = 'No se ha podido'; }
      setTimeout(() => { b.textContent = 'Copiar enlace'; }, 1600);
    });
    document.getElementById('enlace-aqui').hidden = false;
    document.getElementById('abrir-arv').addEventListener('click', abrirEnARviewerOL);
  };
  // «Abrir en ARviewerOL» (la copia de Maqueta 3D): el QR de cada maqueta es de quien
  // la hizo y su proyecto vive en su equipo. Se le pregunta al ARviewerOL de este
  // equipo: si el proyecto es de aquí, lo enseña; si no, se dice de quién es y cómo
  // hacer otra versión (con el mismo nombre, al subirla sustituye a esta).
  const ARVIEWEROL = 'http://127.0.0.1:7410';
  const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  async function abrirEnARviewerOL() {
    const nota = document.getElementById('nota-arv');
    const decir = html => { nota.innerHTML = html; nota.hidden = false; };
    const maqueta = (location.pathname.match(/\/muestras\/([^/]+)\//) || [])[1] || null;
    let ficha = {};
    try { ficha = await (await fetch('muestra.json', { cache: 'no-cache' })).json(); } catch (e) {}
    const quien = ficha.porNombre || ficha.por || '';
    const otraVersion = 'Para hacer otra versión, crea la tuya en ARviewerOL desde Revit con el mismo nombre' +
      (p.nombre ? ' («' + esc(p.nombre) + '»)' : '') + ': al subirla a Maqueta 3D sustituirá a esta, ' +
      'y el QR de la de ahora seguirá funcionando.';
    let r = null;
    try {
      // text/plain: una petición simple, sin la pregunta previa del navegador
      const resp = await fetch(ARVIEWEROL + '/api/plataforma/abrir', { method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ maqueta, qr: p.qr || null }) });
      if (resp.ok) r = await resp.json();
    } catch (e) {}
    if (r && r.ok) decir('Abierta en ARviewerOL: <b>' + esc(r.proyecto.nombre) + '</b>.' +
                         (r.ventana ? '' : ' Su ventana está en la barra de tareas.'));
    else if (r) decir('Esta maqueta y su QR son de ' + (quien ? '<b>' + esc(quien) + '</b>' : 'quien la subió') +
                      ': su proyecto está en su equipo, y desde ahí se actualiza. ' + otraVersion);
    else decir('ARviewerOL no está abierto en este equipo. Ábrelo y vuelve a pulsar.' +
               (quien ? ' Esta maqueta la subió <b>' + esc(quien) + '</b>: solo se actualiza desde su equipo.' : ''));
  }
  const deB64url = t => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/') +
    '='.repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0));

  async function abrirCifrado(id, clave) {
    const r = await fetch('m/' + id + '.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('no-esta');
    const caja = new Uint8Array(await r.arrayBuffer());
    const llave = await crypto.subtle.importKey('raw', deB64url(clave), 'AES-GCM', false, ['decrypt']);
    const claro = new Uint8Array(await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: caja.slice(0, 12) }, llave, caja.slice(12)));
    // ARV1: el GLB tal cual. ARV2: comprimido (zlib) antes de cifrar, que cifrado
    // ya no se comprime: un modelo de 44 MB baja en 10.
    const formato = new TextDecoder().decode(claro.slice(0, 4));
    if (formato !== 'ARV1' && formato !== 'ARV2') throw new Error('formato');
    const n = new DataView(claro.buffer).getUint32(4, true);
    const p = JSON.parse(new TextDecoder().decode(claro.slice(8, 8 + n)));
    let glb = new Blob([claro.slice(8 + n)]);
    if (formato === 'ARV2') {
      if (!window.DecompressionStream) throw new Error('navegador');
      glb = await new Response(glb.stream().pipeThrough(new DecompressionStream('deflate'))).blob();
    }
    p.src = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    return p;
  }

  let p = {};
  const h = location.hash.slice(1);
  if (h) {
    const [id, clave] = h.split('.');
    if (!/^[\w-]{8,}$/.test(id || '') || !/^[\w-]{40,}$/.test(clave || '')) {
      error('Este enlace no está completo. Vuelve a escanear el código QR.'); return;
    }
    // El modelo está en la memoria del móvil, no en una dirección: Scene Viewer
    // (Android) no puede ir a buscarlo. Android entra por WebXR; iPhone, por
    // Quick Look con el USDZ que model-viewer hace al momento.
    visor.setAttribute('ar-modes', 'webxr quick-look');
    try { p = await abrirCifrado(id, clave); }
    catch (e) {
      error(e.message === 'no-esta' ? 'Este modelo ya no está publicado.'
          : e.message === 'navegador' ? 'Este navegador es demasiado antiguo para abrir el modelo. Actualízalo y vuelve a escanear el código.'
          : 'No se ha podido abrir el modelo con este enlace.');
      return;
    }
  } else {
    try { p = await (await fetch('proyecto.json', { cache: 'no-cache' })).json(); } catch (e) {}
    p.src = p.modelo || 'modelo.glb';
  }

  if (p.nombre) {
    document.getElementById('nombre').textContent = p.nombre;
    document.title = p.nombre + ' · Ortiz.Leon Arquitectos';
  }

  visor.addEventListener('error', () => error('No se ha podido abrir el modelo.'));
  visor.addEventListener('load', () => {
    const boton = document.getElementById('ver-ar');
    if (visor.canActivateAR) {
      boton.hidden = false;
      boton.addEventListener('click', () => visor.activateAR());
    } else {
      document.getElementById('sin-ar').style.display = 'block';
      // En un ordenador, el QR para pasarla al móvil: el de esta misma dirección
      // (publicada, con su clave) o, en la copia de Maqueta 3D, el que lleva proyecto.json
      const destino = /^https:/.test(location.href) ? location.href : p.qr;
      if (window.qrcode && destino && !matchMedia('(pointer: coarse)').matches) {
        const qr = qrcode(0, 'M'); qr.addData(destino); qr.make();
        const caja = document.getElementById('qr-aqui');
        caja.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        caja.style.display = 'block';
        document.getElementById('sin-ar').textContent = 'Gira el modelo con el ratón. Para verlo en tu espacio, escanea el código con el móvil.';
        if (destino === p.qr) mostrarEnlace(p.qr);
      }
    }
  });
  const pedido = new URLSearchParams(location.search).get('estilo');
  if (new URLSearchParams(location.search).has('portada')) {
    document.body.classList.add('portada');
    visor.setAttribute('interaction-prompt', 'none');      // sin la mano encima de la portada
  }
  // «color» es el nombre viejo de «texturas» (lo publicado antes del 05/11/2026)
  const deVerdad = e => e === 'color' ? 'texturas' : e;
  // Los modos que enseña esta maqueta: los elige el estudio en ARviewerOL (20/11/2026);
  // sin elegir, o en lo publicado antes, los tres. Con uno solo no hay conmutador.
  const TODOS = ['blanco', 'texturas', 'madera'];
  const MODOS = Array.isArray(p.estilos) && p.estilos.some(e => TODOS.includes(e))
    ? TODOS.filter(e => p.estilos.includes(e)) : TODOS;
  document.querySelectorAll('#estilos button').forEach(b => { b.hidden = !MODOS.includes(b.dataset.estilo); });
  const abreEn = [deVerdad(pedido), deVerdad(p.estilo)].find(e => MODOS.includes(e))
    || (MODOS.includes('texturas') ? 'texturas' : MODOS[0]);
  // El modelo no se enseña hasta que tiene su estilo (reveal="manual"): antes salía un
  // momento con los colores en bruto del GLB, más oscuros, y luego cambiaba (17/11/2026).
  // Con tope: si algo de los estilos se atasca, se enseña igual a los 8 s.
  const ensenar = () => { try { visor.dismissPoster(); } catch (e) {} };
  visor.addEventListener('load', () => {
    setTimeout(ensenar, 8000);
    prepararEstilos(abreEn)
      .catch(e => console.error('estilos', e))
      .finally(() => requestAnimationFrame(ensenar));
  }, { once: true });
  ponerVista(p.camara);
  visor.src = p.src;

  // ── La vista con la que se abre ─────────────────────────────────────────
  // La elegida en ARviewerOL girando la previa («Vista al abrir»). Va en metros
  // reales (vale con cualquier escala) y el campo de visión es el «encuadrado» de
  // model-viewer, que él mismo abre en las pantallas estrechas (un móvil en vertical).
  // Se pone antes de cargar: el modelo aparece ya desde ahí, sin salto.
  function ponerVista(c) {
    if (!c || !c.orbita || !c.objetivo || !c.fov) return;
    const e = p.escala || 1, m = x => (x / e).toFixed(5) + 'm';
    visor.cameraOrbit = c.orbita[0] + 'deg ' + c.orbita[1] + 'deg ' + m(c.orbita[2]);
    visor.cameraTarget = c.objetivo.map(m).join(' ');
    visor.fieldOfView = c.fov + 'deg';
  }
  // Para la ventana de ARviewerOL: la vista en la que está ahora la previa
  window.vistaActual = () => {
    if (!visor.loaded) return null;
    const sim = Object.getOwnPropertySymbols(visor).find(x => x.description === 'scene');
    const escena = sim && visor[sim];
    const o = visor.getCameraOrbit(), t = visor.getCameraTarget(), e = p.escala || 1;
    const rad = Math.PI / 180;
    // el campo de visión de la cámara, deshecho el ensanche de pantalla estrecha
    const k = escena && escena.idealAspect && escena.aspect ? Math.max(1, escena.idealAspect / escena.aspect) : 1;
    const fov = 2 * Math.atan(Math.tan(visor.getFieldOfView() * rad / 2) / k) / rad;
    return { orbita: [o.theta / rad, o.phi / rad, o.radius * e], objetivo: [t.x * e, t.y * e, t.z * e], fov };
  };

  // ── Los estilos ─────────────────────────────────────────────────────────
  // Los materiales del GLB se llaman por su papel (edificio, entorno, terreno,
  // vidrio, tronco, copa, agua, verde, hierba, mueble, texto, acera, calzada, y
  // «lineas» las aristas). Lo que trae el GLB es el modo
  // Texturas: el aspecto de render de Revit, con su textura a tamaño real.
  //  · Blanco: como la «Línea oculta» de Revit, todo blanco mate con sus aristas,
  //    el terreno y los árboles en tonos muy pálidos.
  //  · Madera: maqueta de taller de tilo y abedul, veta fina y de poco contraste,
  //    el entorno en otro tono, metacrilato el vidrio, los árboles como el liquen
  //    seco de las maquetas. La veta se dibuja aquí, en un lienzo.
  const lineal = c => Math.pow(c / 255, 2.2);
  const deSRGB = (c, a) => [lineal(c[0]), lineal(c[1]), lineal(c[2]), a == null ? 1 : a];
  // Blanco, para lo que no trae su color de Revit: blanco, como pinta «Línea oculta»
  const BLANCO = {
    edificio: [[255, 255, 255]], entorno: [[255, 255, 255]], terreno: [[255, 255, 255]],
    agua: [[215, 235, 240]], verde: [[226, 234, 214]], hierba: [[206, 222, 190]],
    copa: [[200, 210, 150]], tronco: [[175, 160, 140]], vidrio: [[230, 236, 240], 0.35],
  };
  // Madera: la vegetación (césped, jardineras) en maderas más oscuras, para que se
  // distinga del resto, como en una maqueta de taller; y el agua, metacrilato azulado y
  // transparente (hasta el 17/11/2026, madera oscura: la piscina se leía como un hueco)
  // Desde el 18/11/2026, el mobiliario y los rótulos en blanco, sin veta (como las
  // piezas impresas de una maqueta de taller: se distinguen del edificio), y la acera y
  // la calzada en maderas más oscuras, con la misma veta suave
  const MADERA = {
    edificio: [[240, 229, 207]], entorno: [[228, 212, 184]], terreno: [[220, 201, 168]],
    verde: [[196, 170, 126]], agua: [[176, 204, 210], 0.45], hierba: [[184, 158, 116]],
    copa: [[198, 180, 138]], tronco: [[178, 152, 114]], vidrio: [[234, 238, 236], 0.3],
    mueble: [[247, 246, 242]], texto: [[247, 246, 242]],
    acera: [[212, 194, 163]], calzada: [[182, 165, 138]],
  };
  const SIN_VETA = ['vidrio', 'agua', 'mueble', 'texto'];
  // La transparencia de los árboles: la elige el estudio al publicar (en proyecto.json)
  const ALFA_ARBOLES = typeof p.alfa_arboles === 'number' && p.alfa_arboles >= 0.2 && p.alfa_arboles <= 1 ? p.alfa_arboles : 0.8;
  // Y la del vidrio (null: como en cada modo; en Texturas, la de su material de Revit)
  const ALFA_VIDRIO = typeof p.alfa_vidrio === 'number' && p.alfa_vidrio >= 0.1 && p.alfa_vidrio <= 1 ? p.alfa_vidrio : null;

  // La veta de Madera: una vuelta son 6 cm de maqueta (VETA_MAQUETA_M de ar_glb.py).
  // Como el roble cortado al hilo de las maquetas de taller: fibra fina y densa a
  // trozos (rayitas cortas, unas más claras y otras más oscuras), hebras algo más
  // largas y unas manchas anchas y suaves de tono. Nada de líneas seguidas: hasta el
  // 17/11/2026 era una suma de senos, y sus líneas, todas iguales y a la misma
  // distancia, se leían como filas por encima de suelos y cubiertas (628 Iberia).
  // Todo es periódico en N: la textura casa consigo misma al repetirse.
  function lienzoDeVeta() {
    const N = 512, cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const g = cv.getContext('2d'), img = g.createImageData(N, N), d = img.data;
    let semilla = 7;
    const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
    // Ruido de valor sobre una rejilla de gx × gy casillas que da la vuelta en N:
    // pocas a lo largo de la fibra (x) y muchas a lo ancho (y), y sale a rayas cortas
    const rejilla = (gx, gy) => {
      const r = new Float32Array(gx * gy).map(azar);
      return (x, y) => {
        const u = x * gx / N, v = y * gy / N, i0 = Math.floor(u), j0 = Math.floor(v);
        let fu = u - i0, fv = v - j0;
        fu = fu * fu * (3 - 2 * fu); fv = fv * fv * (3 - 2 * fv);
        const i = ((i0 % gx) + gx) % gx, i1 = (i + 1) % gx, j = ((j0 % gy) + gy) % gy, j1 = (j + 1) % gy;
        const a = r[j * gx + i], b = r[j * gx + i1], c = r[j1 * gx + i], e = r[j1 * gx + i1];
        return a + (b - a) * fu + (c - a) * fv + (a - b - c + e) * fu * fv;
      };
    };

    FOLLAJE.uDentro.value = estilo === 'blanco' ? 0 : 1;
    FOLLAJE.uReaviva.value = estilo === 'texturas' && FOLLAJE_NUEVO ? 1 : 0;
    FOLLAJE.uRevit.value = estilo === 'texturas' ? 1 : 0;
    AGUA.uOlas.value = OLAS_ESTILO[estilo] || 0;
    if (follaje || agua) soplar(escena);
    if (escena.queueRender) escena.queueRender();
  }

  // El color de Blanco: el de Revit si el material lo trae; si no, el de la tabla
  function colorDe(hex, papel) {
    if (hex && /^[0-9a-f]{6}$/i.test(hex)) return [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
    return (BLANCO[papel] || BLANCO.edificio)[0];
  }

  const gris = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

  function vestir(m, o, estilo) {
    // El nombre es «papel» o «papel;rrggbb», con el color del material en la
    // «Línea oculta» de Revit (su relleno sólido)
    const pbr = m.pbrMetallicRoughness, [papel, hex] = m.name.split(';');
    if (papel === 'lineas') return;           // las aristas van por escenaDelEstilo()
    const tex = pbr.baseColorTexture;
    const alfaCopa = papel === 'copa' ? ALFA_ARBOLES : null;
    const alfaVidrio = papel === 'vidrio' ? ALFA_VIDRIO : null;
    // Las copas y las matas de hierba de los GLB desde el 16/11/2026 son tarjetas con
    // el dibujo de sus hojas, recortado por su transparencia: el dibujo va en todos
    // los modos (sin él serían cuadrados) y el recorte también, con o sin transparencia
    const recortada = (papel === 'copa' || papel === 'hierba') && !!o.textura;
    const ponerAlfa = a => {
      if (!m.setAlphaMode) return;
      // (con BLEND, el recorte lo pone escenaDelEstilo: model-viewer lo quita)
      if (recortada) m.setAlphaMode(a != null && a < 1 ? 'BLEND' : 'MASK');
      else m.setAlphaMode(a != null && a < 1 ? 'BLEND' : 'OPAQUE');
    };
    let emisivo = o.emisivo;

    if (estilo === 'texturas') {
      let c = ARBOLES[papel] && hex == null ? deSRGB(ARBOLES[papel][0]) : o.color.slice();
      const g = gris(c);
      // (el follaje de tarjetas, no: es pintado, y apagado se veía mustio)
      // (el césped, como estaba: su verde ya era el bueno)
      const d = recortada ? 0 : papel === 'verde' ? 0.18 : DESATURA;
      c = c.slice(0, 3).map(x => x + (g - x) * d).concat([alfaCopa != null ? alfaCopa : alfaVidrio != null ? alfaVidrio : c[3]]);
      if (FOLLAJE_NUEVO && (recortada || papel === 'verde')) c = sobrio(c);
      pbr.setBaseColorFactor(c);
      // el agua, más lisa: sus olas se leen por el reflejo del cielo
      pbr.setRoughnessFactor(papel === 'agua' ? Math.min(o.rugosidad, 0.06) : o.rugosidad);
      pbr.setMetallicFactor(o.metal);
      if (tex) tex.setTexture(o.textura);
      if (alfaCopa != null || recortada) ponerAlfa(alfaCopa);
      else if (alfaVidrio != null && m.setAlphaMode) m.setAlphaMode(alfaVidrio < 1 ? 'BLEND' : 'OPAQUE');
      else if (m.setAlphaMode && o.alfa) m.setAlphaMode(o.alfa);
    } else if (estilo === 'blanco') {
      const [cTabla, aTabla] = BLANCO[papel] || BLANCO.edificio;
      const vidrio = papel === 'vidrio';
      // El agua, transparente y lisa como en los otros modos (17/11/2026): con menos luz
      // propia y el sol entero, para que sus olas se lean en el reflejo
      const agua = papel === 'agua';
      const c = deSRGB(vidrio ? cTabla : colorDe(hex, papel));
      const a = alfaCopa != null ? alfaCopa : alfaVidrio != null ? alfaVidrio : agua ? AGUA_BLANCO.alfa : aTabla;
      ponerAlfa(a);
      pbr.setBaseColorFactor(vidrio ? c.slice(0, 3).concat([a])
                                    : c.slice(0, 3).map(x => x * (agua ? AGUA_BLANCO.sol : BLANCO_LUZ.sol)).concat([a == null ? 1 : a]));
      if (!vidrio) emisivo = c.slice(0, 3).map(x => x * (agua ? AGUA_BLANCO.propia : BLANCO_LUZ.propia));
      pbr.setRoughnessFactor(vidrio ? 0.2 : agua ? 0.08 : 1);
      pbr.setMetallicFactor(0);
      if (tex) tex.setTexture(recortada ? o.textura : null);
    } else {
      const [c0, aTabla] = MADERA[papel] || MADERA.edificio;
      // el dibujo de las hojas es gris (oscurece lo que pinta): su madera, más clara
      const c = recortada ? c0.map(x => Math.min(255, Math.round(x * 1.22))) : c0;
      const a = alfaCopa != null ? alfaCopa : alfaVidrio != null ? alfaVidrio : aTabla;
      ponerAlfa(a);
      pbr.setBaseColorFactor(deSRGB(c, a));
      pbr.setRoughnessFactor(papel === 'vidrio' ? 0.2 : papel === 'agua' ? 0.08 : papel === 'copa' ? 1 : 0.8);
      pbr.setMetallicFactor(0);
      if (tex) tex.setTexture(recortada ? o.textura : SIN_VETA.includes(papel) ? null : VETA);
      if (tex && !recortada && tex.texture && tex.texture.sampler) {
        tex.texture.sampler.setWrapS(10497); tex.texture.sampler.setWrapT(10497);   // REPEAT
      }
    }
    if (m.setEmissiveFactor && o.emisivo) m.setEmissiveFactor(emisivo);
  }
})();
</script>
