<!doctype html>
<!-- La página que abre el QR en el móvil del cliente. Es la misma para todos los
     proyectos: publicada (ARviewerOL-visor en GitHub Pages) descifra el modelo con
     la clave de la dirección; en la previa de ARviewerOL lee proyecto.json. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ortiz.Leon Arquitectos</title>
<link rel="icon" href="monograma.png">
<script type="module" src="model-viewer.min.js"></script>
<script src="qrcode.js"></script>
<style>
  :root {
    --tinta: #262626; --tenue: #787673; --lienzo: #f0efec; --elevada: #fff;
    --oliva: #3f5544; --filete: #d7d5d2;
    --serie: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--lienzo); color: var(--tinta);
    font-family: var(--serie); -webkit-font-smoothing: antialiased; }
  model-viewer { position: fixed; inset: 0; width: 100%; height: 100%;
    --poster-color: transparent; --progress-bar-color: var(--oliva); }
  .cabecera { position: fixed; z-index: 2; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 16px; pointer-events: none; }
  .cabecera img { height: 24px; width: auto; flex: none; }
  .cabecera .nombre { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .cabecera .estudio { font-size: 12px; color: var(--tenue); }
  .pie { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px 20px calc(env(safe-area-inset-bottom) + 22px); pointer-events: none; }
  .pie > * { pointer-events: auto; }
  .boton-ar { display: inline-flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 26px; border: 0; border-radius: 26px;
    background: var(--oliva); color: #fff; font: 700 16px var(--serie);
    box-shadow: 0 6px 22px rgba(38, 38, 38, .22); cursor: pointer; }
  .boton-ar svg { width: 22px; height: 22px; }
  .sin-ar { display: none; max-width: 34ch; font-size: 13px; color: var(--tinta);
    text-align: center; background: rgba(255,255,255,.8); padding: 10px 14px; border-radius: 10px; }
  .qr-aqui { display: none; width: 128px; padding: 6px; background: #fff; border-radius: 10px;
    box-shadow: 0 4px 16px rgba(38,38,38,.12); }
  .qr-aqui svg { display: block; width: 100%; height: auto; }
  /* El conmutador de estilo: Color (los materiales de Revit) o Madera (maqueta de taller) */
  .estilos { position: fixed; z-index: 3; top: calc(env(safe-area-inset-top) + 18px); right: 16px;
    display: none; padding: 3px; gap: 2px; border-radius: 99px;
    background: rgba(255,255,255,.82); box-shadow: 0 2px 10px rgba(38,38,38,.12);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .estilos button { height: 30px; padding: 0 13px; border: 0; border-radius: 99px; background: none;
    font: 600 13px var(--serie); color: var(--tenue); cursor: pointer; }
  .estilos button[aria-pressed="true"] { background: var(--oliva); color: #fff; }
  body.portada .cabecera, body.portada .pie, body.portada .estilos { display: none !important; }
  .error { position: fixed; inset: 0; display: none; place-items: center; padding: 30px;
    text-align: center; color: var(--tenue); }
</style>
</head>
<body>
<header class="cabecera">
  <img src="monograma.png" alt="">
  <div><div class="nombre" id="nombre">&nbsp;</div>
       <div class="estudio">Ortiz.Leon Arquitectos</div></div>
</header>

<div class="estilos" id="estilos" role="group" aria-label="Cómo se ve la maqueta">
  <button data-estilo="color" aria-pressed="true">Color</button>
  <button data-estilo="madera" aria-pressed="false">Madera</button>
</div>

<model-viewer id="visor" alt="Modelo 3D del proyecto"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls touch-action="pan-y" interaction-prompt="auto"
  camera-orbit="-35deg 65deg auto" shadow-intensity="1" shadow-softness="0.8"
  environment-image="neutral" exposure="1.05">
  <button slot="ar-button" class="boton-ar" style="display:none" aria-hidden="true"></button>
</model-viewer>

<div class="pie">
  <button class="boton-ar" id="ver-ar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
    Ver en tu espacio</button>
  <div class="qr-aqui" id="qr-aqui"></div>
  <div class="sin-ar" id="sin-ar">Gira el modelo con el dedo. Para verlo en tu espacio, abre esta
    página en un móvil o una tableta.</div>
</div>
<div class="error" id="error">No se ha podido abrir el modelo.</div>

<script>
// Dos maneras de abrir un modelo:
//  - publicado: la dirección lleva #<id>.<clave>. Se baja m/<id>.bin (cifrado,
//    AES-256-GCM) y se descifra aquí con la clave, que no sale nunca del móvil.
//  - previa en ARviewerOL: sin «#», proyecto.json y modelo.glb a su lado.
(async function () {
  const visor = document.getElementById('visor');
  const error = texto => {
    const e = document.getElementById('error');
    e.textContent = texto; e.style.display = 'grid';
    document.querySelector('.pie').style.display = 'none';
  };
  const deB64url = t => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/') +
    '='.repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0));

  async function abrirCifrado(id, clave) {
    const r = await fetch('m/' + id + '.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('no-esta');
    const caja = new Uint8Array(await r.arrayBuffer());
    const llave = await crypto.subtle.importKey('raw', deB64url(clave), 'AES-GCM', false, ['decrypt']);
    const claro = new Uint8Array(await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: caja.slice(0, 12) }, llave, caja.slice(12)));
    // ARV1: el GLB tal cual. ARV2: comprimido (zlib) antes de cifrar, que cifrado
    // ya no se comprime: un modelo de 44 MB baja en 10.
    const formato = new TextDecoder().decode(claro.slice(0, 4));
    if (formato !== 'ARV1' && formato !== 'ARV2') throw new Error('formato');
    const n = new DataView(claro.buffer).getUint32(4, true);
    const p = JSON.parse(new TextDecoder().decode(claro.slice(8, 8 + n)));
    let glb = new Blob([claro.slice(8 + n)]);
    if (formato === 'ARV2') {
      if (!window.DecompressionStream) throw new Error('navegador');
      glb = await new Response(glb.stream().pipeThrough(new DecompressionStream('deflate'))).blob();
    }
    p.src = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    return p;
  }

  let p = {};
  const h = location.hash.slice(1);
  if (h) {
    const [id, clave] = h.split('.');
    if (!/^[\w-]{8,}$/.test(id || '') || !/^[\w-]{40,}$/.test(clave || '')) {
      error('Este enlace no está completo. Vuelve a escanear el código QR.'); return;
    }
    // El modelo está en la memoria del móvil, no en una dirección: Scene Viewer
    // (Android) no puede ir a buscarlo. Android entra por WebXR; iPhone, por
    // Quick Look con el USDZ que model-viewer hace al momento.
    visor.setAttribute('ar-modes', 'webxr quick-look');
    try { p = await abrirCifrado(id, clave); }
    catch (e) {
      error(e.message === 'no-esta' ? 'Este modelo ya no está publicado.'
          : e.message === 'navegador' ? 'Este navegador es demasiado antiguo para abrir el modelo. Actualízalo y vuelve a escanear el código.'
          : 'No se ha podido abrir el modelo con este enlace.');
      return;
    }
  } else {
    try { p = await (await fetch('proyecto.json', { cache: 'no-cache' })).json(); } catch (e) {}
    p.src = p.modelo || 'modelo.glb';
  }

  if (p.nombre) {
    document.getElementById('nombre').textContent = p.nombre;
    document.title = p.nombre + ' · Ortiz.Leon Arquitectos';
  }

  visor.addEventListener('error', () => error('No se ha podido abrir el modelo.'));
  visor.addEventListener('load', () => {
    const boton = document.getElementById('ver-ar');
    if (visor.canActivateAR) {
      boton.hidden = false;
      boton.addEventListener('click', () => visor.activateAR());
    } else {
      document.getElementById('sin-ar').style.display = 'block';
      // En un ordenador, el QR para pasarla al móvil: el de esta misma dirección
      // (publicada, con su clave) o, en la copia de Maqueta 3D, el que lleva proyecto.json
      const destino = /^https:/.test(location.href) ? location.href : p.qr;
      if (window.qrcode && destino && !matchMedia('(pointer: coarse)').matches) {
        const qr = qrcode(0, 'M'); qr.addData(destino); qr.make();
        const caja = document.getElementById('qr-aqui');
        caja.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        caja.style.display = 'block';
        document.getElementById('sin-ar').textContent = 'Gira el modelo con el ratón. Para verlo en tu espacio, escanea el código con el móvil.';
      }
    }
  });
  const pedido = new URLSearchParams(location.search).get('estilo');
  if (new URLSearchParams(location.search).has('portada')) document.body.classList.add('portada');
  visor.addEventListener('load', () => prepararEstilos(
    ['color', 'madera'].includes(pedido) ? pedido : (p.estilo || 'color')), { once: true });
  visor.src = p.src;

  // ── Los estilos ─────────────────────────────────────────────────────────
  // Los materiales del GLB se llaman por su papel (edificio, entorno, terreno,
  // vidrio, tronco, copa). «Color» deja los de Revit; «Madera» los viste como
  // una maqueta de taller: arce el edificio, madera más tostada el entorno,
  // corcho el terreno, metacrilato el vidrio, bolas de madera los árboles.
  // La veta se dibuja aquí, en un lienzo: el modelo no pesa más por ella.
  const MADERA = {          // sRGB
    edificio: [240, 226, 196], entorno: [196, 164, 124], terreno: [168, 132, 94],
    copa: [226, 204, 164], tronco: [150, 116, 80],
  };
  const lineal = c => Math.pow(c / 255, 2.2);

  function lienzoDeVeta() {
    const N = 512, cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const g = cv.getContext('2d'), img = g.createImageData(N, N), d = img.data;
    const ruido = new Float32Array(N);
    let semilla = 7;
    for (let i = 0; i < N; i++) { semilla = (semilla * 16807) % 2147483647; ruido[i] = semilla / 2147483647; }
    const T = 2 * Math.PI / N;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      // Todo periódico en 512: la textura casa consigo misma al repetirse
      // Veta fina y casi recta, de poco contraste: de lejos se funde, de cerca se lee
      const t = y + 2.2 * Math.sin(T * 2 * x) + 1.1 * Math.sin(T * 5 * x + 1.3);
      const a = 0.5 + 0.5 * Math.sin(T * 16 * t), b = 0.5 + 0.5 * Math.sin(T * 41 * t + 2);
      const fila = ruido[((Math.round(t) % N) + N) % N];
      const v = 1 - 0.055 * Math.pow(a, 4) - 0.035 * Math.pow(b, 6) - 0.035 * fila;
      const k = (y * N + x) * 4, c = Math.round(255 * v);
      d[k] = d[k + 1] = d[k + 2] = c; d[k + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return cv.toDataURL('image/png');
  }

  const ORIGINAL = new Map();
  let VETA = null;

  async function prepararEstilos(inicial) {
    for (const m of visor.model.materials) {
      ORIGINAL.set(m, { color: m.pbrMetallicRoughness.baseColorFactor.slice(),
                        rugosidad: m.pbrMetallicRoughness.roughnessFactor });
    }
    try { VETA = await visor.createTexture(lienzoDeVeta()); } catch (e) { VETA = null; }
    const caja = document.getElementById('estilos');
    caja.style.display = 'flex';
    caja.querySelectorAll('button').forEach(b => b.addEventListener('click', () => ponerEstilo(b.dataset.estilo)));
    ponerEstilo(inicial);
  }

  function ponerEstilo(estilo) {
    document.querySelectorAll('#estilos button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.estilo === estilo)));
    for (const m of visor.model.materials) {
      const o = ORIGINAL.get(m), pbr = m.pbrMetallicRoughness, papel = m.name;
      if (estilo === 'madera') {
        if (papel === 'vidrio') {
          pbr.setBaseColorFactor([0.86, 0.9, 0.92, 0.42]);
          pbr.setRoughnessFactor(0.25);
          continue;
        }
        const c = MADERA[papel] || MADERA.edificio;
        pbr.setBaseColorFactor([lineal(c[0]), lineal(c[1]), lineal(c[2]), 1]);
        pbr.setRoughnessFactor(0.72);
        if (VETA && pbr.baseColorTexture) {
          pbr.baseColorTexture.setTexture(VETA);
          const sm = pbr.baseColorTexture.texture && pbr.baseColorTexture.texture.sampler;
          if (sm) { sm.setWrapS(10497); sm.setWrapT(10497); }      // REPEAT
        }
      } else {
        pbr.setBaseColorFactor(o.color);
        pbr.setRoughnessFactor(o.rugosidad);
        if (pbr.baseColorTexture) pbr.baseColorTexture.setTexture(null);
      }
    }
  }
})();
</script>
</body>
</html>
